basePath: /
definitions:
  handlers.PersonaResponse:
    properties:
      email:
        description: '✨ Nuevo: email asociado'
        type: string
      id:
        type: string
      neighborhood_id:
        type: integer
      nombre:
        type: string
      route_number:
        type: integer
      truck_id:
        type: integer
    type: object
  handlers.RequestBody:
    properties:
      descripcion:
        example: Incendio en edificio de oficinas
        type: string
      tipo:
        example: incendio
        type: string
    type: object
  handlers.ResponseBody:
    properties:
      descripcion:
        example: Incendio en edificio de oficinas
        type: string
      message:
        example: Emergencia enviada correctamente
        type: string
      tipo:
        example: incendio
        type: string
    type: object
  handlers.RouteNavigationResponse:
    properties:
      current_index:
        type: integer
      current_point:
        $ref: '#/definitions/services.Coordinate'
      is_first_point:
        type: boolean
      is_last_point:
        type: boolean
      next_point:
        $ref: '#/definitions/services.Coordinate'
      next_point_key:
        description: Clave para obtener el siguiente punto
        type: string
      previous_point_key:
        description: Clave para volver al anterior
        type: string
      progress_percentage:
        type: number
      route_id:
        type: string
      total_points:
        type: integer
    type: object
  handlers.UpdateCapacidadRequest:
    properties:
      capacidad:
        example: 90
        type: number
    type: object
  handlers.UpdateCapacidadResponse:
    properties:
      capacidad:
        example: 90
        type: number
      id_tacho:
        example: 1
        type: integer
      message:
        example: Capacidad actualizada correctamente
        type: string
    type: object
  handlers.UpdatePrioridadRequest:
    properties:
      prioridad:
        example: 2
        type: integer
    type: object
  handlers.UpdatePrioridadResponse:
    properties:
      id_neo:
        type: string
      id_tacho:
        type: integer
      message:
        type: string
      prioridad:
        type: integer
    type: object
  services.Camion:
    properties:
      capacidad:
        type: integer
      id_camion:
        type: integer
      marca:
        type: string
      matricula:
        type: string
      modelo:
        type: string
      nombre_tipo:
        type: string
      tipo_estado:
        type: string
    type: object
  services.CamionResponse:
    properties:
      camion:
        $ref: '#/definitions/services.Camion'
    type: object
  services.CamionesResponse:
    properties:
      camiones:
        items:
          $ref: '#/definitions/services.Camion'
        type: array
      total:
        type: integer
    type: object
  services.CaracteristicaTacho:
    properties:
      estado:
        type: string
      nombre:
        type: string
      prioridad:
        type: integer
    type: object
  services.Centro:
    properties:
      id_centro:
        type: integer
      id_mongo:
        type: integer
      latitud:
        type: number
      longitud:
        type: number
      neighborhood:
        type: integer
      nombre_tipo:
        type: string
    type: object
  services.CentroResponse:
    properties:
      centro:
        $ref: '#/definitions/services.Centro'
    type: object
  services.CentrosResponse:
    properties:
      centros:
        items:
          $ref: '#/definitions/services.Centro'
        type: array
      total:
        type: integer
    type: object
  services.Coordinate:
    properties:
      lat:
        type: number
      lon:
        type: number
    type: object
  services.CreateCamionRequestRedis:
    properties:
      capacidad:
        minimum: 1
        type: integer
      marca:
        minLength: 2
        type: string
      matricula:
        minLength: 1
        type: string
      modelo:
        minLength: 2
        type: string
      nombre_tipo:
        description: Basura | Reciclaje | Limpieza | Especial
        type: string
      tipo_estado:
        description: Operativo | En uso | En mantenimiento | Fuera de servicio
        type: string
    required:
    - capacidad
    - marca
    - matricula
    - modelo
    - nombre_tipo
    - tipo_estado
    type: object
  services.CreateTachoRequest:
    properties:
      capacidad:
        type: number
      id:
        description: Datos para MongoDB (id, lat, lon, neighborhood)
        type: integer
      id_estado:
        type: integer
      id_tipo:
        description: Datos para MySQL
        type: integer
      lat:
        type: number
      lon:
        type: number
      neighborhood:
        description: Número de barrio
        type: integer
    type: object
  services.CreateTachoResponse:
    properties:
      message:
        type: string
      mongo_id:
        type: integer
      tacho_id:
        type: integer
    type: object
  services.NeighborhoodRoutesInfo:
    properties:
      neighborhood:
        type: integer
      routes:
        items:
          type: integer
        type: array
    type: object
  services.SimplifiedRoute:
    properties:
      bins_coords:
        description: Coordenadas de tachos en orden
        items:
          $ref: '#/definitions/services.Coordinate'
        type: array
      neighborhood:
        type: integer
      path_coords:
        description: Coordenadas del path completo
        items:
          $ref: '#/definitions/services.Coordinate'
        type: array
      route_id:
        type: string
      total_bins:
        type: integer
      total_distance_km:
        type: number
      truck_id:
        type: integer
    type: object
  services.TachoCompleto:
    properties:
      capacidad:
        type: number
      caracteristicas:
        items:
          $ref: '#/definitions/services.CaracteristicaTacho'
        type: array
      estado:
        type: string
      id_tacho:
        type: integer
      latitud:
        type: number
      longitud:
        type: number
      neighborhood:
        type: integer
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para gestión de rutas y emergencias
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: IntegracionDeAplicaciones2 API
  version: "1.0"
paths:
  /camiones:
    get:
      description: Obtiene una lista de todos los camiones con información de tipo
        y estado mediante JOINs
      produces:
      - application/json
      responses:
        "200":
          description: Lista de camiones obtenida exitosamente
          schema:
            $ref: '#/definitions/services.CamionesResponse'
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener todos los camiones
      tags:
      - Camiones
    post:
      consumes:
      - application/json
      description: Crea un camión y lo almacena en Redis usando nombres de tipo y
        estado directamente. No impacta los listados actuales basados en MySQL.
      parameters:
      - description: Datos del camión a crear
        in: body
        name: camion
        required: true
        schema:
          $ref: '#/definitions/services.CreateCamionRequestRedis'
      produces:
      - application/json
      responses:
        "201":
          description: Camión creado
          schema:
            $ref: '#/definitions/services.Camion'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Crear camión
      tags:
      - Camiones
  /camiones/{id}:
    delete:
      description: Elimina el hash camion:<id> y remueve su ID de la lista camiones:ids
        (solo almacenamiento temporal en Redis)
      parameters:
      - description: ID del camión
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Camión eliminado
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Camión no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Eliminar camión
      tags:
      - Camiones
    get:
      description: Obtiene la información completa de un camión específico mediante
        su ID, incluyendo tipo y estado
      parameters:
      - description: ID del camión
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Camión obtenido exitosamente
          schema:
            $ref: '#/definitions/services.CamionResponse'
        "400":
          description: ID de camión inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Camión no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener un camión por ID
      tags:
      - Camiones
  /centros:
    get:
      description: Obtiene una lista de todos los centros con información de tipo
        (MySQL) y datos adicionales como nombre, barrio, dirección, coordenadas (Neo4j)
      produces:
      - application/json
      responses:
        "200":
          description: Lista de centros obtenida exitosamente
          schema:
            $ref: '#/definitions/services.CentrosResponse'
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener todos los centros
      tags:
      - Centros
  /centros/{id}:
    get:
      description: Obtiene la información completa de un centro específico mediante
        su ID, incluyendo tipo (MySQL) y datos adicionales como nombre, barrio, dirección,
        coordenadas (Neo4j)
      parameters:
      - description: ID del centro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Centro obtenido exitosamente
          schema:
            $ref: '#/definitions/services.CentroResponse'
        "400":
          description: ID de centro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Centro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener un centro por ID
      tags:
      - Centros
  /cron/update-routes:
    post:
      consumes:
      - application/json
      description: Calcula y almacena en caché las rutas óptimas para todas las zonas
      parameters:
      - description: Clave de API para cron jobs
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resultados de la actualización
          schema:
            additionalProperties: true
            type: object
        "401":
          description: No autorizado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar todas las rutas en caché
      tags:
      - Cron
  /enviar-emergencia:
    post:
      consumes:
      - application/json
      description: Registra una nueva emergencia en el sistema
      parameters:
      - description: Datos de la emergencia
        in: body
        name: emergencia
        required: true
        schema:
          $ref: '#/definitions/handlers.RequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: Emergencia enviada correctamente
          schema:
            $ref: '#/definitions/handlers.ResponseBody'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Enviar emergencia
      tags:
      - Emergencias
  /personas:
    get:
      consumes:
      - application/json
      description: Devuelve la lista completa de personas con sus asignaciones
      produces:
      - application/json
      responses:
        "200":
          description: Lista de personas
          schema:
            items:
              $ref: '#/definitions/handlers.PersonaResponse'
            type: array
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener todas las personas
      tags:
      - Personas
  /personas/{id}:
    get:
      consumes:
      - application/json
      description: Devuelve los datos de una persona específica
      parameters:
      - description: ID de la persona
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Datos de la persona
          schema:
            $ref: '#/definitions/handlers.PersonaResponse'
        "404":
          description: Persona no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener persona por ID
      tags:
      - Personas
  /personas/emails:
    get:
      consumes:
      - application/json
      description: Devuelve todas las personas con sus emails asignados para saber
        qué email usar en cada ruta
      produces:
      - application/json
      responses:
        "200":
          description: Listado de personas con emails
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener listado de personas con emails
      tags:
      - Personas
  /personas/neighborhood/{neighborhood}:
    get:
      consumes:
      - application/json
      description: Devuelve todas las personas asignadas a un barrio específico
      parameters:
      - description: Número de barrio
        in: path
        name: neighborhood
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Personas del barrio
          schema:
            items:
              $ref: '#/definitions/handlers.PersonaResponse'
            type: array
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener personas por barrio
      tags:
      - Personas
  /personas/regenerate:
    post:
      consumes:
      - application/json
      description: Regenera todas las personas con sus emails desde las rutas existentes
        en cache
      produces:
      - application/json
      responses:
        "200":
          description: Personas regeneradas exitosamente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error regenerando personas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Regenerar personas desde rutas
      tags:
      - Personas
  /routes/neighborhood/{neighborhood}:
    get:
      consumes:
      - application/json
      description: Devuelve todas las rutas simplificadas guardadas en caché para
        un barrio específico
      parameters:
      - description: ID del barrio
        in: path
        name: neighborhood
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de rutas del barrio
          schema:
            items:
              $ref: '#/definitions/services.SimplifiedRoute'
            type: array
        "400":
          description: Neighborhood ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No se encontraron rutas
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener rutas de un barrio
      tags:
      - Rutas
  /routes/neighborhood/{neighborhood}/route/{routeNumber}:
    get:
      consumes:
      - application/json
      description: Devuelve una ruta simplificada específica desde caché
      parameters:
      - description: ID del barrio
        in: path
        name: neighborhood
        required: true
        type: integer
      - description: Número de ruta
        in: path
        name: routeNumber
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Ruta solicitada
          schema:
            $ref: '#/definitions/services.SimplifiedRoute'
        "400":
          description: Parámetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Ruta no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener ruta específica
      tags:
      - Rutas
  /routes/neighborhoods:
    get:
      consumes:
      - application/json
      description: Devuelve un resumen de todos los neighborhoods con las rutas disponibles
        en cada uno
      produces:
      - application/json
      responses:
        "200":
          description: Lista de neighborhoods con sus rutas
          schema:
            items:
              $ref: '#/definitions/services.NeighborhoodRoutesInfo'
            type: array
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar neighborhoods y sus rutas
      tags:
      - Rutas
  /ruta-optima:
    get:
      consumes:
      - application/json
      description: Devuelve la ruta óptima y distancias para la zona de la persona
        asociada al email
      parameters:
      - description: email del usuario
        in: header
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de puntos con distancias
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Email faltante o inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario o persona no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener ruta óptima por email
      tags:
      - Rutas
  /ruta-optima/{zonaID}:
    get:
      consumes:
      - application/json
      description: Devuelve la ruta óptima y distancias para una zona específica
      parameters:
      - description: ID de la zona
        in: path
        name: zonaID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de puntos con distancias
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: zonaID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener ruta óptima
      tags:
      - Rutas
  /tachos:
    delete:
      consumes:
      - application/json
      description: Elimina un tacho tanto de MySQL como de MongoDB usando el ID de
        MongoDB
      parameters:
      - description: ID del tacho en MongoDB
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tacho eliminado exitosamente
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Parámetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Tacho no encontrado en ninguna base
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Eliminar un tacho
      tags:
      - Tachos
    get:
      consumes:
      - application/json
      description: Devuelve todos los tachos con neighborhood, latitud, longitud,
        estado y capacidad
      produces:
      - application/json
      responses:
        "200":
          description: Lista de todos los tachos
          schema:
            items:
              $ref: '#/definitions/services.TachoCompleto'
            type: array
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener todos los tachos
      tags:
      - Tachos
    post:
      consumes:
      - application/json
      description: Crea un tacho guardándolo tanto en MySQL como en Neo4j
      parameters:
      - description: Datos del tacho a crear
        in: body
        name: tacho
        required: true
        schema:
          $ref: '#/definitions/services.CreateTachoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tacho creado exitosamente
          schema:
            $ref: '#/definitions/services.CreateTachoResponse'
        "400":
          description: Datos de entrada inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Crear un nuevo tacho
      tags:
      - Tachos
  /tachos/{id_tacho}/prioridad:
    put:
      consumes:
      - application/json
      description: Actualiza el campo prioridad de un tacho en Neo4j
      parameters:
      - description: ID del tacho
        in: path
        name: id_tacho
        required: true
        type: integer
      - description: Nueva prioridad del tacho
        in: body
        name: prioridad
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdatePrioridadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Prioridad actualizada correctamente
          schema:
            $ref: '#/definitions/handlers.UpdatePrioridadResponse'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar prioridad del tacho
      tags:
      - Tachos
  /tachos/{id}/capacidad:
    put:
      consumes:
      - application/json
      description: Actualiza el campo capacidad de un tacho en MySQL
      parameters:
      - description: ID del tacho
        in: path
        name: id
        required: true
        type: integer
      - description: Nueva capacidad del tacho
        in: body
        name: capacidad
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCapacidadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Capacidad actualizada correctamente
          schema:
            $ref: '#/definitions/handlers.UpdateCapacidadResponse'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualizar capacidad del tacho
      tags:
      - Tachos
  /v2/ruta-navegacion-by-header:
    get:
      consumes:
      - application/json
      description: Devuelve el punto actual y siguiente de la ruta asignada al conductor
      parameters:
      - description: Email del conductor
        in: header
        name: X-User-Email
        required: true
        type: string
      - default: 0
        description: Índice del punto actual (0 = inicio)
        in: query
        name: index
        type: integer
